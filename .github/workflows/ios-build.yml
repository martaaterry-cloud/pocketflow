name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - ios-beta

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ] && grep -q '"@capacitor/core"' package.json; then
            echo "framework=capacitor" >> "$GITHUB_OUTPUT"
            echo "Detected framework: Capacitor"
          elif [ -f "pubspec.yaml" ]; then
            echo "framework=flutter" >> "$GITHUB_OUTPUT"
            echo "Detected framework: Flutter"
          elif [ -f "package.json" ] && grep -q '"react-native"' package.json; then
            echo "framework=react-native" >> "$GITHUB_OUTPUT"
            echo "Detected framework: React Native"
          else
            echo "framework=native" >> "$GITHUB_OUTPUT"
            echo "Detected framework: Native iOS"
          fi

      - name: Setup Node.js (Capacitor)
        if: steps.detect.outputs.framework == 'capacitor'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (Capacitor)
        if: steps.detect.outputs.framework == 'capacitor'
        run: npm ci

      - name: Patch Capacitor plugins for Capacitor 8
        if: steps.detect.outputs.framework == 'capacitor'
        run: |
          if [ -f "node_modules/@capacitor/app/ios/Sources/AppPlugin/AppPlugin.swift" ]; then
            echo "Patching @capacitor/app AppPlugin.swift for Capacitor 8 Swift API..."
            sed -i.bak 's/call\.reject("Unable to get App Info")/call.error("Unable to get App Info")/g' node_modules/@capacitor/app/ios/Sources/AppPlugin/AppPlugin.swift
          fi

      - name: Build web assets (Capacitor)
        if: steps.detect.outputs.framework == 'capacitor'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xcarqzopfaozxugfhslo.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYXJxem9wZmFvenh1Z2Zoc2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTUyMjUsImV4cCI6MjEwMzgzMTIyNX0.-P30LrQ_-sE0rFtomrRGxdHXX9QJ2JPsoqc6oklTOUU' }}
        run: npm run build

      - name: Sync Capacitor iOS
        if: steps.detect.outputs.framework == 'capacitor'
        run: npx cap sync ios

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build iOS App with Xcode
        run: |
          CONFIG="${{ inputs.configuration || 'Release' }}"
          echo "Building scheme 'App' with configuration '$CONFIG'..."
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app directory found in build output!"
            exit 1
          fi
          echo "Packaging application from $APP_DIR into IPA..."
          cp -R "$APP_DIR" Payload/
          zip -r PocketFlow-unsigned.ipa Payload
          ls -lh PocketFlow-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlow-unsigned-ipa
          path: PocketFlow-unsigned.ipa
          if-no-files-found: error
